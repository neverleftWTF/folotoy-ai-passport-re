<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyber工牌 // 专属控制台</title>
  <style>
    :root {
      --bg: #0C0E12;
      --surface: #161920;
      --border: #262B36;
      --mint: #3ECF8E;
      --text: #F3F4F6;
      --muted: #717786;
      --red: #E53935;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; max-width: 480px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
    h1 { font-size: 18px; color: var(--mint); letter-spacing: 1px; }
    .status-badge { font-size: 12px; padding: 4px 8px; border-radius: 4px; background: var(--surface); border: 1px solid var(--border); color: var(--muted); }
    .status-badge.connected { color: var(--mint); border-color: var(--mint); font-weight: bold; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .card h2 { font-size: 13px; color: var(--muted); margin-bottom: 12px; text-transform: uppercase; }
    .btn { display: inline-flex; align-items: center; justify-content: center; width: 100%; padding: 12px; background: var(--mint); color: #0C0E12; font-weight: bold; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; margin-top: 8px; transition: all 0.1s; }
    .btn:active { opacity: 0.8; transform: translateY(1px); }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-outline:active { border-color: var(--mint); color: var(--mint); }
    .btn-red { background: transparent; border: 1px solid #7F2020; color: #FF6666; font-size: 12px; padding: 8px; margin-top: 6px; }
    input, textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 6px; font-size: 14px; margin-bottom: 10px; outline: none; }
    input:focus, textarea:focus { border-color: var(--mint); }
    .tips { font-size: 12px; color: var(--muted); line-height: 1.5; margin-top: 8px; }
    .log-box { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px; font-family: monospace; font-size: 11px; color: var(--muted); height: 130px; overflow-y: auto; margin-top: 10px; line-height: 1.4; }
    .log-success { color: var(--mint); }
    .log-err { color: var(--red); }
    .auto-panel { background: rgba(62, 207, 142, 0.15); border: 2px solid var(--mint); border-radius: 8px; padding: 14px; margin-bottom: 16px; display: none; }
  </style>
</head>
<body>
  <header>
    <h1>AI PASSPORT // HUB</h1>
    <div id="status" class="status-badge">未连接</div>
  </header>

  <div id="autoPanel" class="auto-panel">
    <div style="font-size: 14px; color: var(--mint); font-weight: bold; margin-bottom: 6px;">⚡ 收到自动化验证码：</div>
    <div id="autoMsg" style="font-size: 16px; color: #fff; font-weight: bold; margin-bottom: 12px; word-break: break-all;"></div>
    <button id="btnAutoSend" class="btn" style="margin-top:0; font-size:15px; padding:14px;">🚀 立即发送到工牌屏幕</button>
  </div>

  <div class="card">
    <h2>1. 专属一键直连 (已锁定特征)</h2>
    <button id="btnConnect" class="btn">⚡ 一键连接 AI Passport</button>
    <button id="btnDisconnect" class="btn btn-red" style="display:none;">断开连接</button>
    <div class="tips">
      🎯 <strong>保活模式</strong>：在 Bluefy 中连接一次后，直接切换到手机后台常驻。收到短信时将秒级通过活跃通道直推工牌！
    </div>
  </div>

  <div class="card">
    <h2>2. 一键时间校准 (东八区 UTC+8)</h2>
    <button id="btnSyncTime" class="btn btn-outline">同步当前手机时间至工牌</button>
  </div>

  <div class="card">
    <h2>3. 动态天气与便签推屏</h2>
    <input type="text" id="inpNote" value="杭州 // 26℃ 晴" placeholder="输入你想在工牌上显示的文字">
    <button id="btnSendNote" class="btn btn-outline">更新工牌便签文字</button>
  </div>

  <div class="card">
    <h2>4. 手机通知 / 验证码弹窗测试 (持续15秒)</h2>
    <input type="text" id="inpNotifSrc" value="SMS 验证码" placeholder="通知来源 (SMS / WeChat / 外卖)">
    <input type="text" id="inpNotifMsg" value="验证码: 849201" placeholder="通知正文">
    <button id="btnSendNotif" class="btn btn-outline">发送弹窗通知到工牌 (15s)</button>
  </div>

  <div class="card">
    <h2>实时交互日志</h2>
    <div class="log-box" id="logBox">> 专属控制台就绪，请点击上方「一键连接」...</div>
  </div>

  <script>
    const SVC_UUID = "54524145-4341-5244-0000-000000000000";
    const CH_WRITE = "54524145-4341-5244-0000-000000000010";
    let device = null;
    let server = null;
    let writeChar = null;
    let pendingPayload = null;

    const log = (msg, type = "") => {
      const b = document.getElementById('logBox');
      const cls = type === "success" ? "log-success" : (type === "err" ? "log-err" : "");
      b.innerHTML += `<div class="${cls}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
      b.scrollTop = b.scrollHeight;
    };

    const setupGATT = async (dev) => {
      device = dev;
      const devName = device.name || device.id || "AI Passport";
      log(`正在建立蓝牙通信链路: ${devName}...`);
      
      device.addEventListener('gattserverdisconnected', () => {
        document.getElementById('status').innerText = "已断开";
        document.getElementById('status').classList.remove('connected');
        document.getElementById('btnDisconnect').style.display = 'none';
        writeChar = null;
        log("⚠️ 蓝牙连接已断开", "err");
      });

      server = await device.gatt.connect();
      const service = await server.getPrimaryService(SVC_UUID);
      writeChar = await service.getCharacteristic(CH_WRITE);

      document.getElementById('status').innerText = `已连接: ${devName}`;
      document.getElementById('status').classList.add('connected');
      document.getElementById('btnDisconnect').style.display = 'block';
      log(`✅ 专属连接成功！链路已就绪。`, "success");
      return true;
    };

    const connectBLE = async () => {
      try {
        log("🔍 正在请求蓝牙设备权限...");
        const dev = await navigator.bluetooth.requestDevice({
          filters: [
            { namePrefix: "4c11" },
            { namePrefix: "AI" }
          ],
          optionalServices: [SVC_UUID]
        });
        return await setupGATT(dev);
      } catch (err) {
        if (err.name === 'NotFoundError' || err.message.includes('cancelled')) {
          log("⚠️ 提示：未选择设备或已取消。", "err");
        } else {
          log(`❌ 连接异常: ${err.message}`, "err");
        }
        return false;
      }
    };

    document.getElementById('btnConnect').onclick = connectBLE;

    document.getElementById('btnDisconnect').onclick = () => {
      if (device && device.gatt.connected) {
        device.gatt.disconnect();
        log("已主动断开蓝牙连接。");
      }
    };

    const sendJson = async (obj) => {
      if (!writeChar || !device || !device.gatt.connected) {
        pendingPayload = obj;
        document.getElementById('autoPanel').style.display = 'block';
        document.getElementById('autoMsg').innerText = `[${obj.src || '通知'}] ${obj.notify || obj.note}`;
        log("⚠️ 未建立蓝牙连接，请点击上方绿色大按钮连接并发送！", "err");
        return;
      }
      try {
        const jsonStr = JSON.stringify(obj);
        const encoder = new TextEncoder();
        const payload = encoder.encode(jsonStr);
        const frame = new Uint8Array(4 + payload.length);
        frame[0] = 0x01;
        frame[1] = 0x01;
        frame[2] = payload.length & 0xFF;
        frame[3] = (payload.length >> 8) & 0xFF;
        frame.set(payload, 4);
        
        await writeChar.writeValue(frame);
        log(`➡️ 发送成功: ${jsonStr}`, "success");
        if (document.getElementById('autoPanel')) {
          document.getElementById('autoPanel').style.display = 'none';
        }
      } catch (err) {
        log(`❌ 发送失败: ${err.message}`, "err");
      }
    };

    document.getElementById('btnAutoSend').onclick = async () => {
      if (pendingPayload) {
        if (!writeChar) {
          const ok = await connectBLE();
          if (!ok) return;
        }
        await sendJson(pendingPayload);
        pendingPayload = null;
      }
    };

    document.getElementById('btnSyncTime').onclick = () => {
      const epochBeijing = Math.floor(Date.now() / 1000) + 8 * 3600;
      sendJson({ time: epochBeijing });
    };

    document.getElementById('btnSendNote').onclick = () => {
      const note = document.getElementById('inpNote').value;
      if (!note) return;
      sendJson({ note: note });
    };

    document.getElementById('btnSendNotif').onclick = () => {
      const src = document.getElementById('inpNotifSrc').value || "SMS 验证码";
      const msg = document.getElementById('inpNotifMsg').value || "通知测试";
      sendJson({ notify: msg, src: src, duration: 15000 });
    };

    window.addEventListener('load', async () => {
      const url = new URL(window.location.href);
      const notifyParam = url.searchParams.get('notify');
      const srcParam = url.searchParams.get('src') || "SMS 验证码";
      const noteParam = url.searchParams.get('note');

      if (notifyParam) {
        let cleanNotify = notifyParam;
        try { cleanNotify = decodeURIComponent(notifyParam); } catch(e){}
        let cleanSrc = srcParam;
        try { cleanSrc = decodeURIComponent(srcParam); } catch(e){}

        log(`⚡ 自动化传入: [${cleanSrc}] ${cleanNotify}`);
        pendingPayload = { notify: cleanNotify, src: cleanSrc, duration: 15000 };
        document.getElementById('autoPanel').style.display = 'block';
        document.getElementById('autoMsg').innerText = `[${cleanSrc}] ${cleanNotify}`;
      } else if (noteParam) {
        let cleanNote = noteParam;
        try { cleanNote = decodeURIComponent(noteParam); } catch(e){}
        log(`⚡ 自动化传入便签: ${cleanNote}`);
        pendingPayload = { note: cleanNote };
        document.getElementById('autoPanel').style.display = 'block';
        document.getElementById('autoMsg').innerText = `便签: ${cleanNote}`;
      }
    });
  </script>
</body>
</html>
